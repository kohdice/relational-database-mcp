[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["kohdice <k@kohdice.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/kohdice/relational-database-mcp"
rust-version = "1.97"

[workspace.dependencies]
rdb-mcp-core = { path = "crates/rdb-mcp-core" }
anyhow = "1.0.101"
chrono = "0.4.43"
clap = { version = "4.5.58", features = ["derive", "env"] }
futures-util = "0.3.32"
rmcp = { version = "0.16.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "chrono",
    "mysql",
    "postgres",
    "sqlite",
] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

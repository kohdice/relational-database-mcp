[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kohdice/relational-database-mcp"
rust-version = "1.97"

[workspace.dependencies]
rdb-mcp-core = { path = "crates/rdb-mcp-core" }
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = "0.3.34"
rmcp = { version = "3.1.4", features = ["server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "chrono",
    "json",
    "rust_decimal",
    "uuid",
    "mysql",
    "mysql-rsa",
    "postgres",
    "sqlite",
] }
testcontainers-modules = { version = "0.15.0", features = [
    "mysql",
    "postgres",
] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
